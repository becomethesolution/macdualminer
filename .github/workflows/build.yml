name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner (current macOS image)
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
          uname -m

      - name: Unit tests
        run: swift test

      - name: Build app
        run: scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MacDualMiner
          path: build/MacDualMiner-*.zip

      # Publishes a release when VERSION names a version that hasn't been released yet
      # (bump VERSION on main to ship), or when a v* tag is pushed.
      - name: Decide whether to release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already released"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MacDualMiner ${{ steps.release.outputs.tag }}
          files: build/MacDualMiner-*.zip
          generate_release_notes: true
          body_path: .github/release-notes.md
