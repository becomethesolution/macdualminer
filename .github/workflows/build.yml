name: Build

# Compiles MacDualMiner on every push and pull request, the same two ways people build it:
# with full Xcode (plus the unit tests) and with only the Command Line Tools, which lack some
# SwiftUI macros (e.g. @State) – that second job catches code that only builds in Xcode.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Xcode build + tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build (release, arm64)
        run: swift build -c release --arch arm64 --product MacDualMiner
      - name: Unit tests
        run: swift test

  command-line-tools:
    name: Command Line Tools build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the Command Line Tools instead of Xcode
        run: |
          if [ -d /Library/Developer/CommandLineTools/usr/bin ]; then
            echo "DEVELOPER_DIR=/Library/Developer/CommandLineTools" >> "$GITHUB_ENV"
          else
            echo "::warning::Command Line Tools not installed on this runner – building with Xcode instead"
          fi
      - name: Toolchain
        run: swift --version
      - name: Build (release, arm64)
        run: swift build -c release --arch arm64 --product MacDualMiner
